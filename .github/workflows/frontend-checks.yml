name: Frontend checks

on:
  push:
    branches: [main, staging]
  pull_request:

jobs:
  checks:
    name: Lint, types, tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci

      # The storefront is clean of both, so keep it that way — a warning here is
      # a real finding rather than part of a backlog to scroll past.
      - name: Lint
        run: npm run lint -- --max-warnings 0

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Tests
        run: npm test
